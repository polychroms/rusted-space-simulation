<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    
    <radialGradient id="spaceBg" cx="55%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#131c31" />
      <stop offset="55%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>

    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8" />
    </linearGradient>

    
    <linearGradient id="rustMetal" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#6b1d08" />
      <stop offset="35%" stop-color="#ce422b" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="rustDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1008" />
      <stop offset="100%" stop-color="#120907" />
    </linearGradient>

    
    <radialGradient id="planetBase" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="28%" stop-color="#38bdf8" />
      <stop offset="62%" stop-color="#0284c7" />
      <stop offset="88%" stop-color="#0c2d5c" />
      <stop offset="100%" stop-color="#040e21" />
    </radialGradient>

    <radialGradient id="planetAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="92%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.85" />
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    
    <linearGradient id="shellBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="22%" stop-color="#fb923c" />
      <stop offset="58%" stop-color="#b43403" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="shellNose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde68a" />
      <stop offset="68%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#5c1603" />
    </linearGradient>

    <linearGradient id="exhaustCore" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ce422b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="machCone" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce422b" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="1" />
    </linearGradient>

    
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="planetHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <clipPath id="badgeClip">
      <rect x="16" y="16" width="480" height="480" />
    </clipPath>

    <clipPath id="planetClip">
      <circle cx="0" cy="0" r="64" />
    </clipPath>

    
    <path id="tooth" d="M -13,-132 L 13,-132 L 9,-112 L -9,-112 Z" fill="url(#rustMetal)" />
  </defs>

  
  <g clip-path="url(#badgeClip)">
    <rect width="512" height="512" fill="url(#spaceBg)" />

    
    <circle cx="375" cy="135" r="130" fill="#0284c7" opacity="0.14" />
    <circle cx="190" cy="310" r="140" fill="#ce422b" opacity="0.1" />

    
    <g fill="#e0f2fe">
      <circle cx="84" cy="142" r="1.4" opacity="0.8" />
      <circle cx="146" cy="88" r="1.1" opacity="0.6" />
      <circle cx="222" cy="64" r="1.8" opacity="0.9" />
      <circle cx="288" cy="96" r="1" opacity="0.5" />
      <circle cx="110" cy="230" r="1.2" opacity="0.5" />
      <circle cx="72" cy="315" r="1.5" opacity="0.7" />
      <circle cx="155" cy="435" r="1.3" opacity="0.6" />
      <circle cx="310" cy="442" r="1.6" opacity="0.8" />
      <circle cx="430" cy="340" r="1.2" opacity="0.7" />
      <circle cx="452" cy="255" r="1" opacity="0.5" />
      
      <path d="M 184,115 L 186,121 L 192,123 L 186,125 L 184,131 L 182,125 L 176,123 L 182,121 Z" opacity="0.85" />
      <path d="M 412,375 L 413.5,379.5 L 418,381 L 413.5,382.5 L 412,387 L 410.5,382.5 L 406,381 L 410.5,379.5 Z" opacity="0.7" />
    </g>

    
    <g stroke="#38bdf8" stroke-width="1" opacity="0.16" fill="none">
      <circle cx="230" cy="276" r="185" stroke-dasharray="2, 8" />
      <circle cx="230" cy="276" r="148" />
      <line x1="230" y1="50" x2="230" y2="462" stroke-dasharray="4, 12" />
      <line x1="40" y1="276" x2="462" y2="276" stroke-dasharray="4, 12" />
    </g>

    
    <g transform="translate(366, 144)">
      
      <g transform="rotate(-24)">
        <path d="M -108,0 A 108,26 0 0,1 108,0" fill="none" stroke="url(#ringGrad)" stroke-width="7" />
        <path d="M -90,0 A 90,20 0 0,1 90,0" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.5" />
      </g>

      
      <circle cx="0" cy="0" r="64" fill="url(#planetBase)" filter="url(#planetHalo)" />

      
      <g clip-path="url(#planetClip)">
        <circle cx="0" cy="0" r="64" fill="url(#planetBase)" />
        
        <g opacity="0.28" fill="none" stroke="#e0f2fe" stroke-linecap="round">
          <path d="M -72,-28 Q -15,-8 72,-34" stroke-width="9" />
          <path d="M -74,-6 Q -5,16 74,-12" stroke-width="6" />
          <path d="M -70,18 Q 0,36 70,12" stroke-width="11" stroke="#0284c7" opacity="0.6" />
          <path d="M -68,36 Q 5,50 68,28" stroke-width="5" />
        </g>
        
        <path d="M 30,-68 A 68,68 0 0,1 -45,58 A 76,76 0 0,0 68,-25 Z" fill="#020617" opacity="0.55" />
        
        <circle cx="0" cy="0" r="64" fill="url(#planetAtmosphere)" />
      </g>

      
      <g transform="rotate(-24)">
        <path d="M -108,0 A 108,26 0 0,0 108,0" fill="none" stroke="url(#ringGrad)" stroke-width="7" />
        <path d="M -90,0 A 90,20 0 0,0 90,0" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />
      </g>
    </g>

    
    <g transform="translate(226, 276)">
      
      <g>
        <use href="#tooth" />
        <use href="#tooth" transform="rotate(30)" />
        <use href="#tooth" transform="rotate(60)" />
        <use href="#tooth" transform="rotate(90)" />
        <use href="#tooth" transform="rotate(120)" />
        <use href="#tooth" transform="rotate(150)" />
        <use href="#tooth" transform="rotate(180)" />
        <use href="#tooth" transform="rotate(210)" />
        <use href="#tooth" transform="rotate(240)" />
        <use href="#tooth" transform="rotate(270)" />
        <use href="#tooth" transform="rotate(300)" />
        <use href="#tooth" transform="rotate(330)" />
      </g>

      
      <circle cx="0" cy="0" r="106" fill="url(#rustDark)" stroke="url(#rustMetal)" stroke-width="20" />
      
      <circle cx="0" cy="0" r="88" fill="none" stroke="#451206" stroke-width="3" />
      <circle cx="0" cy="0" r="78" fill="#080c15" stroke="url(#rustMetal)" stroke-width="4" />

      
      <g stroke="url(#rustMetal)" stroke-width="10" stroke-linecap="butt">
        <line x1="0" y1="-34" x2="0" y2="-78" />
        <line x1="32" y1="-10" x2="74" y2="-24" />
        <line x1="20" y1="27" x2="46" y2="63" />
        <line x1="-20" y1="27" x2="-46" y2="63" />
        <line x1="-32" y1="-10" x2="-74" y2="-24" />
      </g>

      
      <circle cx="0" cy="0" r="34" fill="#080c15" stroke="url(#rustMetal)" stroke-width="6" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3, 3" opacity="0.6" />
    </g>

    
    <path d="M 48,376 Q 170,408 320,308" fill="none" stroke="url(#trajGrad)" stroke-width="3.5" stroke-dasharray="9, 7" stroke-linecap="round" filter="url(#softGlow)" />

    
    <g transform="translate(348, 288) rotate(-34)">
      
      <path d="M -52,-9 L -185,-22 L -145,0 L -185,22 L -52,9 Z" fill="url(#exhaustCore)" opacity="0.7" filter="url(#softGlow)" />
      <path d="M -52,-5 L -140,0 L -52,5 Z" fill="#ffffff" opacity="0.95" />

      
      <g fill="#fde047" filter="url(#softGlow)">
        <ellipse cx="-82" cy="-16" rx="6" ry="1.2" transform="rotate(8 -82 -16)" />
        <ellipse cx="-112" cy="14" rx="8" ry="1.2" transform="rotate(-6 -112 14)" />
        <ellipse cx="-135" cy="-8" rx="5" ry="1" />
        <circle cx="-96" cy="20" r="1.5" />
      </g>

      
      <path d="M -35,-46 L 68,0 L -35,46" fill="none" stroke="url(#machCone)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -10,-32 L 64,0 L -10,32" fill="none" stroke="url(#machCone)" stroke-width="1.2" opacity="0.6" />

      
      <polygon points="-54,-8.5 -42,-12.5 -42,12.5 -54,8.5" fill="#450a0a" stroke="#9a3412" stroke-width="0.8" />

      
      <rect x="-42" y="-12.5" width="46" height="25" fill="url(#shellBody)" />

      
      <rect x="-34" y="-13.2" width="4.5" height="26.4" rx="1" fill="#fde68a" stroke="#7c2d12" stroke-width="0.7" />
      <rect x="-24" y="-13.2" width="4.5" height="26.4" rx="1" fill="#fde68a" stroke="#7c2d12" stroke-width="0.7" />

      
      <path d="M 4,-12.5 Q 38,-11.5 62,-2 Q 66,0 62,2 Q 38,11.5 4,12.5 Z" fill="url(#shellNose)" />

      
      <path d="M 44,-6.5 Q 58,-2.5 64,0 Q 58,2.5 44,6.5 Z" fill="#ffffff" />

      
      <path d="M -42,-6 L 4,-6 Q 36,-5.5 52,-1.8 L -42,-3 Z" fill="#ffffff" opacity="0.55" />
    </g>

    
    <g transform="translate(396, 392)" stroke="#38bdf8" fill="none" opacity="0.55">
      <circle cx="0" cy="0" r="24" stroke-width="1.2" stroke-dasharray="10, 6" />
      <circle cx="0" cy="0" r="10" stroke-width="1" />
      <line x1="-30" y1="0" x2="-16" y2="0" stroke-width="1.2" />
      <line x1="16" y1="0" x2="30" y2="0" stroke-width="1.2" />
      <line x1="0" y1="-30" x2="0" y2="-16" stroke-width="1.2" />
      <line x1="0" y1="16" x2="0" y2="30" stroke-width="1.2" />
    </g>
  </g>

  
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="url(#rimGrad)" stroke-width="5" />
  <rect x="26" y="26" width="460" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2, 14" opacity="0.4" />
</svg>